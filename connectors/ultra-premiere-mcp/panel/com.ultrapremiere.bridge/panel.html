<!doctype html>
<html><head><meta charset="utf-8"><title>Ultra Premiere</title>
<style>
  :root { color-scheme: dark; }
  body { margin: 0; padding: 12px; background: #232323; color: #d6d6d6; font: 12px/1.45 "Segoe UI", system-ui, sans-serif; }
  .row { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
  .dot { width: 10px; height: 10px; border-radius: 50%; background: #777; flex: none; }
  .dot.on { background: #3fbf6b; } .dot.off { background: #d9534f; }
  h1 { font-size: 13px; margin: 0; font-weight: 600; color: #fff; }
  button { background: #3a3a3a; color: #eee; border: 1px solid #555; border-radius: 4px; padding: 4px 10px; cursor: pointer; }
  button:hover { background: #474747; }
  pre { background: #1a1a1a; border: 1px solid #333; border-radius: 4px; padding: 8px; height: 220px; overflow: auto; margin: 0; white-space: pre-wrap; font: 11px/1.4 Consolas, monospace; }
  .muted { color: #8a8a8a; }
</style></head>
<body>
  <div class="row"><span id="dot" class="dot"></span><h1>Ultra Premiere</h1></div>
  <div class="row muted" id="status">Checking…</div>
  <div class="row"><button id="restart">Start / restart bridge</button><button id="reload">Reload scripts</button></div>
  <pre id="log"></pre>
<script src="./bridge.js"></script>
<script>
  var fs = require('fs');
  var B = window.ClaudeBridge, own = null;
  document.querySelector('h1').textContent = B.CFG.label;
  document.title = B.CFG.label;
  function setStatus(on, text) {
    document.getElementById('dot').className = 'dot ' + (on ? 'on' : 'off');
    document.getElementById('status').textContent = text;
  }
  function refresh() {
    B.health().then(function (ok) {
      setStatus(ok, ok ? 'Connected. Claude can control ' + B.CFG.app + ' (port ' + B.PORT + ').' : 'Bridge not running. Click "Start / restart bridge".');
    });
    try {
      var t = fs.readFileSync(B.LOG_FILE, 'utf8').split('\n').slice(-60).join('\n');
      var el = document.getElementById('log'); el.textContent = t; el.scrollTop = el.scrollHeight;
    } catch (e) {}
  }
  function startHere() {
    B.health().then(function (ok) { if (!ok && !own) own = B.start(function () { refresh(); }); setTimeout(refresh, 600); });
  }
  document.getElementById('restart').onclick = function () {
    if (own) { own.close(); own = null; }
    startHere();
  };
  document.getElementById('reload').onclick = function () {
    B.runCommand('__reload', {}, 20000).then(function (r) { B.log('reload: ' + r); refresh(); });
  };
  startHere();
  setInterval(refresh, 2000);
</script>
</body></html>
